services:
  backend1:
    image: sensu/sensu:${SENSU_VERSION:-latest}
    command: sensu-backend start --log-level debug --debug
    hostname: backend1
    restart: always
    ports:
      - "2379:2379"
      - "2380:2380"
      - "8080:8080"
      - "8081:8081"
      - "6060:6060"
      - "3000:3000"
    environment:
      - SLACK_WEBHOOK_URL=https://hooks.slack.com/services/YOUR/WEBHOOK/URL
      - PAGERDUTY_API_KEY=your-pagerduty-api-key-here
      - MONITORING_API_KEY=your-monitoring-api-key-here
  agent1:
    image: sensu/sensu:${SENSU_VERSION:-latest}
    command: sensu-agent start --backend-url ws://backend1:8081 --log-level warn --keepalive-interval 5 --keepalive-timeout 10
    hostname: agent1
    restart: always
    depends_on:
      - backend1
